[project]
name = "safepass-backend"
version = "0.1.0"
description = "Backend do Assistente Inteligente SAFEpass (Desafio 05)"
requires-python = ">=3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: chama o LLM real (requer LLM_API_KEY)"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = [
  "RUF001", "RUF002", "RUF003",  # textos em pt-BR usam caracteres como "–" e "’" de propósito
  "B008",                        # Depends()/Query() em defaults é o padrão do FastAPI
]

[tool.ruff.lint.per-file-ignores]
# Texto corrido (prompt, base de conhecimento) e tabelas de dados fictícios: quebrar piora a leitura.
"app/assistant/prompt.py" = ["E501"]
"app/seed/data.py" = ["E501"]
"tests/**" = ["E501", "B011", "SIM117"]

[tool.mypy]
python_version = "3.13"
packages = ["app", "scripts"]
strict = true
plugins = ["pydantic.mypy"]
# asyncpg/respx não publicam tipos.
[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true
