services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: safepass
      POSTGRES_PASSWORD: safepass_local
      POSTGRES_DB: safepass
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - safepass46_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safepass -d safepass"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  safepass46_pg:
